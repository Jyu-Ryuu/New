<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tìm điểm khác biệt online</title>
<style>
:root{--bg:#f5f3ff;--card:#fff;--tx:#1e1b4b;--mut:#6b6a8a;--ac:#6d28d9;--ok:#16a34a;--bad:#dc2626;--bd:#ddd9f5}
@media(prefers-color-scheme:dark){:root{--bg:#14122b;--card:#201d42;--tx:#efeeff;--mut:#a5a3c8;--ac:#a78bfa;--bd:#38346b}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
h1{font-size:1.25rem;margin:0}.sub,.note{color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem;margin:8px 0}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-size:1rem;cursor:pointer;font-weight:600;width:100%;margin-top:6px}
button.alt{background:var(--mut)}
#join{max-width:420px;margin:12vh auto 0;text-align:center}
#game{display:none;flex:1;min-height:0;flex-direction:column}
.top{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:10px 14px}
#msg{font-weight:700;font-size:1.05rem;flex:1;text-align:center}.win{color:var(--ok)}.lose{color:var(--bad)}
.top button{width:auto;margin:0;padding:8px 14px}
.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr 300px;gap:12px;padding:0 14px 14px}
.box{min-height:0;position:relative}
.box svg{position:absolute;inset:0;width:100%;height:100%;border-radius:10px;background:#3b3b4f;cursor:crosshair;display:block}
.side{overflow:auto;min-height:0}
ol{list-style:none;margin:8px 0;padding:0}li{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;margin-bottom:4px;background:var(--bg)}
li.me{outline:2px solid var(--ac)}
#adm{display:none;border-top:1px solid var(--bd);margin-top:12px;padding-top:8px}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.shake{animation:sh .25s}
#res{display:none;position:fixed;inset:0;background:rgba(10,8,30,.72);align-items:center;justify-content:center;z-index:10;padding:16px}
#res .card{width:min(520px,100%);max-height:90vh;overflow:auto;text-align:center}
#res h2{margin:0 0 4px;font-size:1.5rem}#res .big{font-size:1.2rem;font-weight:700;margin:8px 0 12px}
#res table{width:100%;border-collapse:collapse;margin-bottom:8px}#res td,#res th{padding:8px;border-bottom:1px solid var(--bd)}
#res td:first-child{text-align:left}#res th{color:var(--mut);font-weight:600;font-size:.85rem}
@media(max-width:900px){body{height:auto;overflow:auto}#game{display:none}.main{grid-template-columns:1fr}
 .box{position:static}.box svg{position:static;height:auto}.top{flex-wrap:wrap}}
</style></head><body>
<div id="join" class="card"><h1>🔍 Tìm điểm khác biệt</h1>
<p class="sub">Nhập tên để vào chơi chung một màn. Không cần đăng nhập.</p>
<input id="name" maxlength="20" placeholder="Tên của bạn…" autocomplete="off"><button id="go">Vào chơi</button></div>

<div id="game">
 <div class="top"><div><h1 id="title">🔍</h1><span class="sub">Bạn: <b id="me"></b> · Còn lại: <b id="left"></b></span></div>
  <div id="msg"></div><button id="showres" style="display:none">📊 Xem kết quả</button></div>
 <div class="main">
  <div class="box"><svg id="A"></svg></div>
  <div class="box"><svg id="B"></svg></div>
  <div class="card side"><b>Bảng điểm</b><ol id="board"></ol><p class="note" id="status"></p>
   <div id="adm"><b>Quản trị</b><select id="lvsel"></select><button id="setlv">Chuyển tới màn này</button>
   <button id="rst" class="alt">Chơi lại màn hiện tại</button><button id="zero" class="alt">Xoá hết điểm</button></div></div>
 </div>
</div>

<div id="res"><div class="card"><h2 id="rtitle"></h2><div class="big" id="rwin"></div>
 <table><thead><tr><th style="text-align:left">Người chơi</th><th>Màn này</th><th>Tổng</th></tr></thead><tbody id="rbody"></tbody></table>
 <button id="next"></button><button id="rclose" class="alt">Xem lại ảnh</button></div></div>

<script>
var $=function(i){return document.getElementById(i)},NS='http://www.w3.org/2000/svg';
var ws,myPid,myName='',S=null,curLevel=-1;
var q=new URLSearchParams(location.search),room=q.get('r')||'main',adminKey=q.get('admin')||'';
var dismissed=-1;                                    // màn đã đóng bảng kết quả
function flash(t,c){$('msg').className=c||'';$('msg').textContent=t}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function connect(){
 ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/?r='+encodeURIComponent(room));
 ws.onopen=function(){send({t:'join',name:myName,key:adminKey})};
 ws.onmessage=function(e){var m=JSON.parse(e.data);
  if(m.t==='hello'){myPid=m.pid;$('adm').style.display=m.admin?'block':'none'}
  else if(m.t==='state'){S=m;render()}
  else if(m.t==='hit')flash('✅ Chính xác! +1 điểm','win');
  else if(m.t==='dup')flash('Chỗ này có người tìm ra rồi!');
  else if(m.t==='miss')flash('❌ Chưa đúng, thử lại nhé','lose')};
 ws.onclose=function(){$('status').textContent='Mất kết nối, đang thử lại…';setTimeout(connect,1500)};
}
function setLevel(L){
 ['A','B'].forEach(function(s,i){var svg=$(s);svg.setAttribute('viewBox','0 0 '+L.width+' '+L.height);
  svg.innerHTML='<image href="'+(i?L.imageB:L.imageA)+'" width="'+L.width+'" height="'+L.height+'"/>'});
 $('title').textContent='🔍 Màn '+(L.index+1)+'/'+L.count+': '+L.title;
 var sel=$('lvsel');if(sel.options.length!==L.count){sel.innerHTML='';for(var i=0;i<L.count;i++){var o=document.createElement('option');o.value=i;o.textContent='Màn '+(i+1);sel.appendChild(o)}}
 flash('');curLevel=L.index;
}
function results(){
 var L=S.level,per={};
 Object.values(S.found).forEach(function(f){per[f.pid]=per[f.pid]||{name:f.name,n:0,pid:f.pid};per[f.pid].n++});
 S.players.forEach(function(p){if(!per[p.pid])per[p.pid]={name:p.name,n:0,pid:p.pid}});
 var tot={};S.players.forEach(function(p){tot[p.pid]=p.score});
 var last=L.index===L.count-1,rows=Object.values(per);
 rows.sort(function(a,b){return last?((tot[b.pid]||0)-(tot[a.pid]||0)||b.n-a.n):(b.n-a.n)});
 var key=function(r){return last?(tot[r.pid]||0):r.n},top=rows.length?key(rows[0]):0;
 var winners=rows.filter(function(r){return key(r)===top&&top>0}).map(function(r){return r.name});
 $('rtitle').textContent=last?'🏁 Tổng kết cuối cùng':'🎉 Hoàn thành màn '+(L.index+1);
 $('rwin').textContent=winners.length?'🏆 '+(last?'Quán quân: ':'Thắng màn này: ')+winners.join(', '):'Chưa ai ghi điểm';
 var tb=$('rbody');tb.innerHTML='';var medals=['🥇','🥈','🥉'];
 rows.forEach(function(r,i){var tr=document.createElement('tr');if(r.pid===myPid)tr.style.fontWeight='700';
  [(medals[i]||'#'+(i+1))+' '+r.name+(r.pid===myPid?' (bạn)':''),r.n,tot[r.pid]===undefined?'–':tot[r.pid]].forEach(function(v,j){
   var td=document.createElement('td');td.textContent=v;if(j)td.style.textAlign='center';tr.appendChild(td)});tb.appendChild(tr)});
 $('next').textContent=last?'↻ Chơi lại từ màn 1':'Màn tiếp theo ▶';
}
function render(){
 var L=S.level;if(curLevel!==L.index||!$('A').firstChild){setLevel(L);dismissed=-1}
 var n=Object.keys(S.found).length,fin=n===L.total;$('left').textContent=L.total-n;
 ['A','B'].forEach(function(s){var svg=$(s);svg.querySelectorAll('.mk').forEach(function(e){e.remove()});
  Object.values(S.found).forEach(function(f){var c=document.createElementNS(NS,'circle');
   c.setAttribute('class','mk');c.setAttribute('cx',f.x);c.setAttribute('cy',f.y);c.setAttribute('r',f.r);
   c.setAttribute('fill','none');c.setAttribute('stroke',f.pid===myPid?'#22c55e':'#a855f7');c.setAttribute('stroke-width',Math.max(3,L.width/120));
   c.style.pointerEvents='none';svg.appendChild(c)})});
 var ol=$('board');ol.innerHTML='';
 S.players.forEach(function(p,i){var li=document.createElement('li');if(p.pid===myPid)li.className='me';
  var a=document.createElement('span');a.textContent='#'+(i+1)+' '+p.name+(p.pid===myPid?' (bạn)':'');
  var b=document.createElement('b');b.textContent=p.score;li.appendChild(a);li.appendChild(b);ol.appendChild(li)});
 $('status').textContent=S.players.length+' người đang chơi.';
 $('showres').style.display=fin?'block':'none';
 if(fin){results();flash('🎉 Đã tìm đủ điểm khác biệt!','win');if(dismissed!==L.index)$('res').style.display='flex'}
 else $('res').style.display='none';
}
function click(e){if(!S)return;var svg=e.currentTarget,p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
 var m=svg.getScreenCTM();if(!m)return;p=p.matrixTransform(m.inverse());   // đúng cả khi ảnh bị viền đen (letterbox)
 if(p.x<0||p.y<0||p.x>S.level.width||p.y>S.level.height)return;
 send({t:'click',x:p.x,y:p.y});svg.classList.remove('shake');void svg.offsetWidth;svg.classList.add('shake')}
$('A').onclick=click;$('B').onclick=click;
$('next').onclick=function(){send({t:'next'})};
$('rclose').onclick=function(){dismissed=S.level.index;$('res').style.display='none'};
$('showres').onclick=function(){$('res').style.display='flex'};
$('setlv').onclick=function(){send({t:'admin',op:'level',index:+$('lvsel').value})};
$('rst').onclick=function(){send({t:'admin',op:'restart'})};
$('zero').onclick=function(){send({t:'admin',op:'scores'})};
function start(){var n=$('name').value.trim();if(!n){$('name').focus();return}
 myName=n;$('join').style.display='none';$('game').style.display='flex';$('me').textContent=n;connect()}
$('go').onclick=start;$('name').onkeydown=function(e){if(e.key==='Enter')start()};
</script></body></html>
